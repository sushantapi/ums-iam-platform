server:
  port: 8088
  error:
    include-message: always

spring:
  application:
    name: admin-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET}
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ums: INFO

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
