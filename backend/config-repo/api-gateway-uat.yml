server:
  port: 8080
  error:
    include-message: never

jwt:
  public-key: ${JWT_PUBLIC_KEY:}
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
  issuer: ${JWT_ISSUER:ums-iam-platform}
  audience: ${JWT_AUDIENCE:ums-api-gateway}

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET}

gateway:
  cors:
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: authentication-public
          uri: lb://authentication-service
          predicates:
            - Path=/api/v1/auth/**
        - id: authentication-admin-sessions
          uri: lb://authentication-service
          predicates:
            - Path=/api/v1/admin/sessions/**,/api/v1/admin/users/*/sessions/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: organization-service
          uri: lb://organization-service
          predicates:
            - Path=/api/v1/organizations/**
        - id: authorization-service
          uri: lb://authorization-service
          predicates:
            - Path=/api/v1/authorization/**,/api/v1/roles/**,/api/v1/permissions/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/templates/**
        - id: attendance-service
          uri: lb://attendance-service
          predicates:
            - Path=/api/v1/hrms/attendance/**
        - id: leave-service
          uri: lb://leave-service
          predicates:
            - Path=/api/v1/hrms/leaves/**
        - id: payroll-service
          uri: lb://payroll-service
          predicates:
            - Path=/api/v1/hrms/payroll/**
        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/api/v1/hrms/employees/**,/api/v1/hrms/departments/**,/api/v1/hrms/designations/**
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/**
        - id: audit-events
          uri: lb://audit-service
          predicates:
            - Path=/api/v1/audit/events/**
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
