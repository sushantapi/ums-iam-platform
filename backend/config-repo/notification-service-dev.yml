server:
  port: 8085

spring:
  devtools:
    restart:
      enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/notification_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false

  rabbitmq:
    host: localhost
    port: 5672

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

notification:
  retry:
    initial-delay-ms: 10000
    fixed-delay-ms: 300000

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:local-dev-gateway-secret-change-me}
  service:
    secret: ${INTERNAL_SERVICE_SECRET:local-dev-internal-service-secret-change-me}
