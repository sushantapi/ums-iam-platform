server:
  port: 8085

spring:
  devtools:
    restart:
      enabled: false

  datasource:
    url: jdbc:mysql://localhost:3307/notification_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false

  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:guest}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:guest}}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

notification:
  retry:
    initial-delay-ms: 10000
    fixed-delay-ms: 300000
  password-reset:
    retry:
      max-attempts: 3
      initial-backoff-ms: 1000
      multiplier: 2.0
      max-backoff-ms: 5000

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:local-dev-gateway-secret-change-me}
  service:
    secret: ${INTERNAL_SERVICE_SECRET:local-dev-internal-service-secret-change-me}
