server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/notification_db
    username: root
    password: root

  rabbitmq:
    host: rabbitmq
    port: 5672

  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/