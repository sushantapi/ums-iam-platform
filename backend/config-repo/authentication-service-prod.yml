server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://prod-rds.amazonaws.com:3306/auth_db
    username: auth_prod
    password: ${DB_PASSWORD}

jwt:
  issuer: ums-iam-platform
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

jwt:
  private-key-path: keys/private_key.pem
  public-key-path: keys/public_key.pem
  issuer: ums-iam-platform
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000