server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/user_db
    username: root
    password: root

  rabbitmq:
    host: rabbitmq
    port: 5672

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

jwt:
  public-key-path: keys/public.pem
  issuer: ums-iam-platform
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000