server:
  port: 8087

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:local-dev-gateway-secret-change-me}
  service:
    secret: ${INTERNAL_SERVICE_SECRET:local-dev-internal-service-secret-change-me}

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/organization_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false

organization:
  invitation:
    expiry-hours: ${ORGANIZATION_INVITATION_EXPIRY_HOURS:72}
    accept-page-url: ${ORGANIZATION_INVITATION_ACCEPT_URL:http://localhost:5174/accept-invitation}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
