server:
  port: 8088

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:local-dev-gateway-secret-change-me}
  service:
    secret: ${INTERNAL_SERVICE_SECRET:local-dev-internal-service-secret-change-me}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
