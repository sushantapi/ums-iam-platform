server:
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/authz_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  public-key-path: keys/public_key.pem
  private-key-path: keys/private_key.pem
  issuer: ums-auth-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info