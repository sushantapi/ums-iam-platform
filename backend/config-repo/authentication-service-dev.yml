server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/auth_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: false

jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  private-key-path: ${JWT_PRIVATE_KEY_PATH:}
  public-key: ${JWT_PUBLIC_KEY:}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public_key.pem}
  key-id: ${JWT_KEY_ID:local-dev-2026-06-24}
  audience: ${JWT_AUDIENCE:ums-api-gateway}

security:
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:15}
    reset-page-url: ${PASSWORD_RESET_PAGE_URL:http://localhost:5174/reset-password}

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:local-dev-gateway-secret-change-me}
  service:
    secret: ${INTERNAL_SERVICE_SECRET:local-dev-internal-service-secret-change-me}
