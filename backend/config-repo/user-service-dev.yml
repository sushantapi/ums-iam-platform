server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/user_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:local-dev-gateway-secret-change-me}
  service:
    secret: ${INTERNAL_SERVICE_SECRET:local-dev-internal-service-secret-change-me}
