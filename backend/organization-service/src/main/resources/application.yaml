spring:
  application:
    name: organization-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: false

organization:
  invitation:
    expiry-hours: ${ORGANIZATION_INVITATION_EXPIRY_HOURS:72}
    accept-page-url: ${ORGANIZATION_INVITATION_ACCEPT_URL:http://localhost:5174/accept-invitation}
  logo:
    storage:
      root: ${ORGANIZATION_LOGO_STORAGE_ROOT:./data/organization-assets}
      max-bytes: ${ORGANIZATION_LOGO_MAX_BYTES:2097152}

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:local-dev-gateway-secret-change-me}
  service:
    secret: ${INTERNAL_SERVICE_SECRET:local-dev-internal-service-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
