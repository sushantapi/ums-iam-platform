spring:
  application:
    name: audit-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:local-dev-gateway-secret-change-me}
  service:
    secret: ${INTERNAL_SERVICE_SECRET:local-dev-internal-service-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
