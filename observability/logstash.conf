input {
  udp {
    port => 5000
    codec => json
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [type] == "java-log" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:thread}\] %-5level %{JAVALOGMESSAGE:logmessage}" }
    }
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }

  # Add service metadata
  if ![service_name] {
    mutate {
      add_field => { "service_name" => "unknown" }
    }
  }

  # Extract error information
  if "ERROR" in [message] or "Exception" in [message] {
    mutate {
      add_tag => [ "error" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ums-iam-%{service_name}-%{+YYYY.MM.dd}"
  }

  # Also output errors to file for debugging
  if "error" in [tags] {
    file {
      path => "/var/log/logstash/errors.log"
      codec => json
    }
  }

  # Console output for debugging
  stdout {
    codec => rubydebug
  }
}
