name: Frontend CI

on:
  push:
    paths:
      - "frontend/admin-portal/**"
      - "docs/releases/**"
      - "docs/architecture/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "frontend/admin-portal/**"
      - "docs/releases/**"
      - "docs/architecture/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Admin Portal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend/admin-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/admin-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
