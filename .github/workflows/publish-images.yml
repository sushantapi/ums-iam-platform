name: Publish Service Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate publish request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      image_prefix: ${{ steps.source.outputs.image_prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and source
        id: source
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match vMAJOR.MINOR.PATCH, for example v1.2.0."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Production images may only be published from main."
            exit 1
          fi

          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/${VERSION}"; then
            echo "::error::Release tag ${VERSION} already exists; published release versions are immutable."
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${image_prefix}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} from ${source_sha}."

  publish:
    name: Publish ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-service
          - config-service
          - authentication-service
          - user-service
          - authorization-service
          - organization-service
          - notification-service
          - audit-service
          - admin-service
          - employee-service
          - attendance-service
          - leave-service
          - payroll-service
          - api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: ${{ matrix.service }}
          push: true
          build-args: |
            SERVICE_MODULE=${{ matrix.service }}
          tags: |
            ${{ needs.validate.outputs.image_prefix }}/${{ matrix.service }}:${{ inputs.version }}
            ${{ needs.validate.outputs.image_prefix }}/${{ matrix.service }}:sha-${{ needs.validate.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  summary:
    name: Verify publish set
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify version and SHA tags exist
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          IMAGE_PREFIX: ${{ needs.validate.outputs.image_prefix }}
        run: |
          set -euo pipefail
          services=(
            discovery-service config-service authentication-service user-service
            authorization-service organization-service notification-service audit-service
            admin-service employee-service attendance-service leave-service payroll-service api-gateway
          )

          for service in "${services[@]}"; do
            docker manifest inspect "${IMAGE_PREFIX}/${service}:${VERSION}" >/dev/null
            docker manifest inspect "${IMAGE_PREFIX}/${service}:sha-${SOURCE_SHA}" >/dev/null
            echo "verified ${service}"
          done

          echo "All production images published for ${VERSION} at ${SOURCE_SHA}."
