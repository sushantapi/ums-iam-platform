name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.hrms.yml"
      - "docker-compose.monitoring.yml"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.hrms.yml"
      - "docker-compose.monitoring.yml"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Backend
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/**/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Security configuration checks
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            --line-number \
            --fixed-strings '${REDIS_PASSWORD:}' \
            backend/config-repo/*-prod.yml \
            backend/config-repo/*-uat.yml
          then
            echo "::error::PROD/UAT must not allow an empty REDIS_PASSWORD fallback."
            exit 1
          fi

          if git ls-files | grep -Ei \
            '(^|/)(\.env($|\.)|.*private.*\.pem$|.*\.key$|.*\.p12$|.*\.pfx$|.*\.jks$|id_rsa$|id_ed25519$)' | \
            grep -Ev '(^|/)\.env\.example$'
          then
            echo "::error::Tracked private-key or local-secret candidate detected."
            exit 1
          fi

          if [ -d backend/config-service/src/main/resources/config ]
          then
            echo "::error::Legacy embedded Config Server directory must not return."
            exit 1
          fi

          grep -Fq \
            '${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}' \
            docker-compose.monitoring.yml

          grep -Fq \
            '${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}' \
            docker-compose.monitoring.yml

          echo "Security configuration checks passed."

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -euo pipefail

          docker compose version

          required_vars="$(
            grep -hEo \
              '\$\{[A-Z][A-Z0-9_]*(:\?[^}]*)?\}' \
              docker-compose.yml \
              docker-compose.hrms.yml \
              docker-compose.monitoring.yml |
            sed -E 's/^\$\{([A-Z][A-Z0-9_]*).*/\1/' |
            sort -u
          )"

          for var in $required_vars
          do
            case "$var" in
              *_PORT|*_MS|*_SECONDS|*_MINUTES|*_TIMEOUT|*_RETRIES)
                export "$var=1"
                ;;
              *)
                export "$var=ci-placeholder"
                ;;
            esac
          done

          docker compose config -q

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.hrms.yml \
            config -q

          docker compose \
            -f docker-compose.monitoring.yml \
            config -q

          echo "Docker Compose configuration checks passed."

      - name: Maven clean verify
        working-directory: backend
        run: ./mvnw -B -ntp clean verify
