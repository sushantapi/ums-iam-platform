services:
  employee-db-init:
    image: mysql:8.0
    container_name: ums-employee-db-init
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      EMPLOYEE_DB_NAME: ${EMPLOYEE_DB_NAME:-employee_db}
    entrypoint:
      - sh
      - -c
      - >
        mysql -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD"
        -e "CREATE DATABASE IF NOT EXISTS \`$$EMPLOYEE_DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        GRANT ALL PRIVILEGES ON \`$$EMPLOYEE_DB_NAME\`.* TO '$$MYSQL_USER'@'%';
        FLUSH PRIVILEGES;"
    networks:
      - ums-network
    depends_on:
      mysql:
        condition: service_healthy

  employee-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: employee-service
      args:
        SERVICE_MODULE: employee-service
    image: employee-service:1.0
    container_name: ums-employee-service
    restart: unless-stopped
    ports:
      - "${EMPLOYEE_SERVICE_PORT:-8095}:8095"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}
      CONFIG_SERVER_URL: http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${EMPLOYEE_DB_NAME:-employee_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    networks:
      - ums-network
    depends_on:
      employee-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8095/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

